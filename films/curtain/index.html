<script>
'use strict';
// Engine/craft snapshot generated by tools/new-riso.mjs. Edit this HTML for this work.
// Donors: prints/workings (baked print), studies/index (live tone/motion), tools/lib/visual-kit.
// Re-run the generator only to create a NEW file. This source owns all subsequent art edits.
const CSS=720, W=1080, OUT=1080, K=1, PITCH=4.6, DUR=80;
const PAPER = '#F2EDE3';
const INK = {
  blue:   '#0078BF',
  pink:   '#FF48B0',
  yellow: '#FFE800',
  green:  '#00A95C',
  orange: '#FF6C2F',
  violet: '#765BA7',
  indigo: '#2E3192',
};

/* Screen angles as rational tangents (b/a). A rotated dot grid only repeats
   seamlessly on a rational tangent, so these are the real angles rather than
   the nominal 15/45/75 — any other value leaves a visible seam where the
   pattern tile wraps. */
const SCREEN = {
  blue:   { a: 4, b: 1 },   // 14.0°
  pink:   { a: 1, b: 4 },   // 76.0°
  yellow: { a: 1, b: 0 },   //  0.0°
  green:  { a: 1, b: 1 },   // 45.0°
  orange: { a: 2, b: 1 },   // 26.6°
  violet: { a: 1, b: 2 },   // 63.4°
  indigo: { a: 1, b: 1 },   // 45.0°
};

/* Registration: each plate misses by a fixed amount, in device px. */
const REG = {
  blue:   [ 1.5, -1.0], pink:   [-2.5,  2.0], yellow: [ 2.0,  1.5],
  green:  [-1.5, -1.5], orange: [ 1.0,  2.0], violet: [-2.0, -1.0],
  indigo: [ 0.0,  0.0],
};

const CX = W / 2, CY = W / 2;

/* ── deterministic randomness ─────────────────────────────────────────────── */

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = (key) => mulberry32(hash(key));

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* ── halftone screens ─────────────────────────────────────────────────────────
   For screen angle tanθ = b/a the dot lattice is generated by the orthogonal
   vectors P/√(a²+b²)·(a,b) and P/√(a²+b²)·(−b,a). That lattice contains
   (P√(a²+b²), 0), so a square tile of side S = P√(a²+b²) repeats seamlessly and
   holds exactly a²+b² dots.

   Screens are anchored to canvas space, never to the object being drawn. A
   screen that rides along with its subject makes the texture crawl, which is
   the single most recognisable way this look goes wrong.                     */

const screens = {};

function buildScreen(name) {
  const { a, b } = SCREEN[name];
  const n = a * a + b * b;
  const S = Math.max(2, Math.round(PITCH * Math.sqrt(n)));
  const P = S / Math.sqrt(n);              // effective pitch after rounding
  const u = P / Math.sqrt(n);
  const v1 = [u * a, u * b], v2 = [-u * b, u * a];

  // Lattice points reduced into the tile, plus wrapped neighbours so dots that
  // straddle an edge are drawn on both sides.
  const pts = [];
  for (let m = -n; m <= n; m++) {
    for (let k = -n; k <= n; k++) {
      const x = m * v1[0] + k * v2[0], y = m * v1[1] + k * v2[1];
      const wx = ((x % S) + S) % S, wy = ((y % S) + S) % S;
      if (!pts.some(p => Math.abs(p[0] - wx) < 0.01 && Math.abs(p[1] - wy) < 0.01)) pts.push([wx, wy]);
    }
  }
  const wrapped = [];
  for (const [x, y] of pts) for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) wrapped.push([x + dx, y + dy]);

  // Threshold tile: a pixel takes ink when coverage exceeds π·d²/P², which is
  // the coverage at which a dot of radius d would reach that pixel.
  const th = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let d2 = Infinity;
      for (const [px, py] of wrapped) {
        const dx = x + 0.5 - px, dy = y + 0.5 - py, q = dx * dx + dy * dy;
        if (q < d2) d2 = q;
      }
      th[y * S + x] = clamp(Math.PI * d2 / (P * P), 0, 1);
    }
  }
  return { S, P, pts, wrapped, th, patterns: new Map() };
}

function screenOf(name) {
  return screens[name] || (screens[name] = buildScreen(name));
}

/** Screen a greyscale coverage canvas into hard dots. Bake-time only. */
function screenCoverage(covCanvas, name) {
  const sc = screenOf(name);
  const w = covCanvas.width, h = covCanvas.height;
  const src = covCanvas.getContext('2d').getImageData(0, 0, w, h);
  const s = src.data;
  for (let y = 0; y < h; y++) {
    const row = (y % sc.S) * sc.S;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const cover = s[i + 3] / 255;
      s[i + 3] = cover > sc.th[row + (x % sc.S)] ? 255 : 0;
    }
  }
  const out = cv(w, h);
  out.getContext('2d').putImageData(src, 0, 0);
  return out;
}

/* ── paper ────────────────────────────────────────────────────────────────────
   Cloudy mottling rather than fine grain: the reference shows blotches a few
   hundred px across at low contrast. Baked once, never recomputed, because any
   per-frame regeneration flickers.                                           */

let paper = null;

function bakePaper() {
  const c = cv(OUT, OUT), x = c.getContext('2d');
  x.setTransform(K, 0, 0, K, 0, 0);
  x.fillStyle = PAPER; x.fillRect(0, 0, W, W);

  const r = rngFor('paper');

  // Mottling is a warm wash with noisy alpha, not a neutral multiply: greyscale
  // noise multiplied over cream desaturates it and reads as smoke rather than
  // paper. Keep it subtle at full size and only obvious when zoomed.
  for (const [res, maxA] of [[30, 0.10], [72, 0.075], [165, 0.05]]) {
    const n = cv(res, res), nx = n.getContext('2d');
    const img = nx.createImageData(res, res);
    for (let i = 0; i < res * res; i++) {
      img.data[i * 4] = 0xB4; img.data[i * 4 + 1] = 0xA6; img.data[i * 4 + 2] = 0x8C;
      img.data[i * 4 + 3] = Math.pow(r(), 1.8) * 255 * maxA;
    }
    nx.putImageData(img, 0, 0);
    x.save();
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(n, 0, 0, W, W);
    x.restore();
  }

  x.save();                                  // fibres
  x.strokeStyle = '#8a7f6a';
  for (let i = 0; i < 420; i++) {
    const px = r() * W, py = r() * W, len = 5 + r() * 22, ang = r() * Math.PI;
    x.globalAlpha = 0.008 + r() * 0.016;
    x.lineWidth = 0.5 + r() * 0.7;
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 5,
                       py + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 5,
                       px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  x.restore();

  x.save();                                  // flecks
  for (let i = 0; i < 2200; i++) {
    x.globalAlpha = 0.012 + r() * 0.03;
    x.fillStyle = r() < 0.55 ? '#7d7362' : '#ffffff';
    x.beginPath();
    x.arc(r() * W, r() * W, 0.4 + r() * 1.0, 0, Math.PI * 2);
    x.fill();
  }
  x.restore();
  return c;
}

/* ── scene drawing helpers ────────────────────────────────────────────────────
   Scenes draw coverage in 1080-space and alpha is tone, so 0.4 means a 40%
   dot screen. Shape helpers carry hand wobble; nothing here is a true circle
   or a straight line.                                                        */

function makeWob(rng, harmonics = 3) {
  const h = [];
  for (let i = 0; i < harmonics; i++) h.push([2 + i, rng() * 2 - 1, rng() * Math.PI * 2]);
  return (th) => h.reduce((s, [k, a, p]) => s + a * Math.sin(k * th + p), 0) / harmonics;
}

const tone = (g, a) => { g.globalAlpha = clamp(a, 0, 1); };


/* ── scene registry ───────────────────────────────────────────────────────── */

const SCENES = {};
const scene = (id, def) => { SCENES[id] = Object.assign({ id, live: null }, def); };

const baked = new Map();

/**
 * Bake a scene to one opaque bitmap: every plate screened, tinted, offset and
 * multiplied onto white, ready to multiply over paper.
 *
 * Baked at its display size, never scaled afterwards. Resampling a halftoned
 * bitmap beats the dot grid against the pixel grid and moirés; real print
 * screens at final size too.
 */
function bakeScene(id, size) {
  const key = id + '@' + size;
  if (baked.has(key)) return baked.get(key);
  const sc = SCENES[id];
  const k = size / W;
  const out = cv(size, size), o = out.getContext('2d');
  o.fillStyle = '#fff';
  o.fillRect(0, 0, size, size);

  const cover = cv(size, size), g = cover.getContext('2d');
  for (const ink of sc.inks) {
    const plate = ink;
    g.setTransform(k, 0, 0, k, 0, 0);
    g.clearRect(0, 0, W, W);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = g.strokeStyle = '#000';
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.save();
    sc.plates(g, ink, rngFor(id + ':' + ink), rngFor(id + ':shape'));
    g.restore();
    starve(g, rngFor(id + ':' + ink + ':void'));

    const dots = screenCoverage(cover, plate);
    const tin = cv(size, size), tx = tin.getContext('2d');
    tx.drawImage(dots, 0, 0);
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = INK[plate];
    tx.fillRect(0, 0, size, size);

    const [rx, ry] = REG[plate];
    o.save();
    o.globalCompositeOperation = 'multiply';
    o.drawImage(tin, rx, ry);
    o.restore();
  }
  baked.set(key, out);
  return out;
}

/** Ink starvation: evenly filled solids read as laser print, so drop flecks. */
function starve(g, rng) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  const w = g.canvas.width, n = Math.round(w * 1.1);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 0.2 + rng() * 0.55;
    g.beginPath();
    g.arc(rng() * w, rng() * w, (0.5 + rng() * 2.0) * K, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}

/* ── craft kit ────────────────────────────────────────────────────────────────
   Drawing vocabulary for scene plates. Copy this whole block into a new film,
   between starve() and the scenes.

   Shapes are Path2D values rather than marks on the context, so one shape can
   be filled on one plate, knocked out of another and hatched on a third. That
   is what plate discipline needs, and it removes the usual trap of rebuilding
   a shape per ink and having the knockout miss.

   Everything draws coverage in 1080-space: fill style is already '#000' and
   globalAlpha is tone, so 0.4 means a 40% dot screen.                        */

const TAU = Math.PI * 2;

/* — shape builders ——————————————————————————————————————————————— */

/** Catmull-Rom through pts, as a dense polyline. */
function curve(pts, closed, per) {
  per = per || 12;
  const n = pts.length, out = [];
  const at = (i) => pts[closed ? (i + n * 2) % n : clamp(i, 0, n - 1)];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (p2[0] - p0[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2
               + (3 * p1[0] - p0[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (p2[1] - p0[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2
               + (3 * p1[1] - p0[1] - 3 * p2[1] + p3[1]) * u3),
      ]);
    }
  }
  if (!closed) out.push(pts[n - 1].slice());
  return out;
}

/** Points around an ellipse, for feeding cut(). */
function ringPts(x, y, rx, ry, n, rot) {
  const out = [], c = Math.cos(rot || 0), s = Math.sin(rot || 0);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, px = Math.cos(th) * rx, py = Math.sin(th) * ry;
    out.push([x + px * c - py * s, y + px * s + py * c]);
  }
  return out;
}

/**
 * Closed hand-cut contour through control points: the silhouette builder.
 * A shape made of arcs and ellipses reads as clip art however good the screen
 * is, because every edge has the same machine curvature.
 *   o.amp   edge waver in px — 2 is a drawn line, 8 is torn stock
 *   o.tear  0..1 chance per sample of a deeper bite inward
 */
function cut(pts, rng, o) {
  o = o || {};
  const amp = o.amp === undefined ? 3 : o.amp, tear = o.tear || 0;
  const c = curve(pts, true, o.per || 10), n = c.length;
  let area = 0;
  for (let i = 0; i < n; i++) {
    const a = c[i], b = c[(i + 1) % n];
    area += a[0] * b[1] - b[0] * a[1];
  }
  const sgn = area > 0 ? 1 : -1;            // keep the normal pointing outward

  /* Displace along the normal, then smooth: an unsmoothed tear lands on one
     sample and reads as damage rather than as a bay in the edge. */
  const w1 = makeWob(rng, 4), w2 = makeWob(rng, 9), d = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU;
    d[i] = (w1(th) + w2(th * 3) * 0.3) * amp;
    if (tear && rng() < tear) d[i] -= amp * (1.4 + rng() * 1.6);
  }
  for (let pass = 0; pass < 2; pass++) {
    const s = Float32Array.from(d);
    for (let i = 0; i < n; i++) d[i] = (s[(i - 1 + n) % n] + s[i] * 2 + s[(i + 1) % n]) * 0.25;
  }

  const p = new Path2D();
  for (let i = 0; i < n; i++) {
    const a = c[(i - 1 + n) % n], b = c[(i + 1) % n];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const x = c[i][0] + sgn * ty * d[i], y = c[i][1] - sgn * tx * d[i];
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  p.closePath();
  return p;
}

/**
 * Variable-width ribbon along a path, as a fillable shape. Canvas has no
 * pressure, so a constant lineWidth is the default and it is what makes stems,
 * branches, whiskers and rigging read as wire. wfn(u) returns half-width.
 */
function nib(pts, wfn, o) {
  o = o || {};
  const c = o.raw ? pts : curve(pts, false, o.per || 10);
  const n = c.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const w = Math.max(0.01, wfn(i / (n - 1)));
    L.push([c[i][0] - ty * w, c[i][1] + tx * w]);
    R.push([c[i][0] + ty * w, c[i][1] - tx * w]);
  }
  const p = new Path2D();
  p.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
  p.closePath();
  return p;
}

/** Width profiles for nib(). */
const wTip = (w) => (u) => w * (1 - u * u);                       // full, lifting to a point
const wSwell = (w, at, k) => (u) => w * Math.exp(-Math.pow((u - at) / (k || 0.35), 2));
const wLeaf = (w, skew) => (u) => w * Math.pow(Math.sin(Math.PI * Math.pow(u, skew || 0.55)), 1.15);

/**
 * Calligraphic width from a held nib: widest where the path runs across the
 * nib's axis, thinnest where it runs along it. This is where hand-drawn line
 * weight comes from, and it is what makes a contour read as drawn rather than
 * traced. Pass the same polyline you give nib(), with raw: true.
 */
function wNib(c, w0, ang, floor) {
  const n = c.length, f = floor === undefined ? 0.22 : floor;
  return (u) => {
    const i = clamp(Math.round(u * (n - 1)), 0, n - 1);
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    const th = Math.atan2(b[1] - a[1], b[0] - a[0]);
    return w0 * (f + (1 - f) * Math.abs(Math.sin(th - ang)));
  };
}

/**
 * A horizon band closed to the bottom of the frame: hills, treeline, roofline,
 * wave. Stack several at falling tone and the air between them reads as depth.
 *   o.amp  height of the undulation   o.freq  how many bumps across the frame
 *   o.tilt fraction of W the far end drops   o.teeth adds a jagged octave
 */
function ridgeAt(y, o) {
  const amp = o.amp === undefined ? 60 : o.amp;
  const w = makeWob(o.rng, o.harm || 5), t = o.teeth ? makeWob(o.rng, 7) : null;
  return (u) => y + w(u * (o.freq || 5)) * amp + (o.tilt || 0) * (u - 0.5) * W
                + (t ? t(u * 37) * amp * 0.22 : 0);
}

/**
 * Mountain profile: overlapping triangular peaks with a jagged octave on top,
 * because a skyline built from smooth harmonics always reads as hills however
 * tall it is. Same u -> y contract as ridgeAt, so ridge() takes either.
 */
function peaksAt(y, o) {
  const amp = o.amp === undefined ? 90 : o.amp, n = o.n || 5, ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({ c: (i + 0.5) / n + (o.rng() - 0.5) * 0.7 / n,
              h: amp * (0.4 + o.rng() * 0.6), w: (0.55 + o.rng() * 0.9) / n,
              lean: (o.rng() - 0.5) * 0.7 });
  }
  const jag = makeWob(o.rng, 8);
  return (u) => {
    let top = y;
    for (const p of ps) {
      const d = (u - p.c) / p.w;
      const yy = y - p.h * Math.max(0, 1 - Math.abs(d)) * (1 + p.lean * (d > 0 ? 1 : -1));
      if (yy < top) top = yy;
    }
    return top + jag(u * 26) * amp * 0.06;
  };
}

/** x across the frame -> the u that ridgeAt takes, for planting on a skyline. */
const ridgeU = (x) => (x + 60) / (W + 120);

function ridge(y, o) {
  o = o || {};
  const f = typeof y === 'function' ? y : ridgeAt(y, o);
  const n = o.n || 120, p = new Path2D();
  p.moveTo(-60, W + 60);
  for (let i = 0; i <= n; i++) p.lineTo(-60 + i / n * (W + 120), f(i / n));
  p.lineTo(W + 60, W + 60);
  p.closePath();
  return p;
}

/* — paint operations ————————————————————————————————————————————— */

/** Fill a shape at a tone. */
function print(g, path, a) { tone(g, a === undefined ? 1 : a); g.fill(path); }

/** Knock a shape out of the plate underneath it, at full coverage.
    A knockout drawn at a tone leaves the screen's gaps behind, so the plate
    below shows through the holes — always clear solid. */
function carve(g, path) {
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-out';
  g.fill(path);
  g.restore();
}

/**
 * Print a shape at an exact tone, clearing whatever the plate already holds
 * beneath it. Tones on one plate add where they overlap, so a stack of ridges
 * drawn back to front ends up solid at the bottom of the frame — which looks
 * like a colour band rather than land. Every plane in a depth stack goes
 * through here.
 */
function plane(g, path, a) { carve(g, path); print(g, path, a); }

/** Outline a shape. Line work fades on width and alpha, never on coverage. */
function keyline(g, path, w, a) {
  tone(g, a === undefined ? 1 : a);
  g.lineWidth = w === undefined ? 3 : w;
  g.stroke(path);
}

/**
 * Tone ramp inside a shape — a coverage gradient, which the screen turns into
 * a dot-size ramp. This is the signature riso gesture and neither film uses it.
 * Baked plates only: a live inkPass screens at one flat coverage, so a gradient
 * there prints smooth, which is the thing the brief forbids.
 *   o.stops  [[at, tone], ...]      o.x0,y0,x1,y1  linear
 *   o.x,y,r0,r  radial
 */
function shade(g, path, o) {
  g.save();
  if (path) g.clip(path);
  const grd = o.r !== undefined
    ? g.createRadialGradient(o.x, o.y, o.r0 || 0, o.x, o.y, o.r)
    : g.createLinearGradient(o.x0, o.y0, o.x1, o.y1);
  for (const [at, a] of o.stops) grd.addColorStop(clamp(at, 0, 1), 'rgba(0,0,0,' + clamp(a, 0, 1) + ')');
  if (o.cut) g.globalCompositeOperation = 'destination-out';
  g.globalAlpha = 1;
  g.fillStyle = grd;
  g.fillRect(-W, -W, W * 3, W * 3);
  g.restore();
}

/**
 * Parallel hatching clipped to a shape: tone made of line rather than dot.
 * Next to the screen it reads as engraving, and it is how a mid-value stops
 * being flat without adding another ink.

/* ── the evening's data ─────────────────────────────────────────────────────────
   One entry per production, in order. year, look and timing are PLACEHOLDERS: evenly
   spaced test years, stand-in stage pictures. Replace with the user's list and photos. */

const PLACEHOLDER = true;
const PRODS = [
  { year: 1986, look: 'salon',  open: 2.4, hold: 5.0 },
  { year: 1992, look: 'chair',  open: 1.1, hold: 4.2 },
  { year: 1998, look: 'forest', open: 2.0, hold: 4.8 },
  { year: 2004, look: 'stairs', open: 1.5, hold: 4.2 },
  { year: 2010, look: 'window', open: 2.2, hold: 4.8 },
  { year: 2016, look: 'rain',   open: 1.3, hold: 4.6 },
  { year: 2022, look: 'table',  open: 1.8, hold: 4.8 },
];
const FINAL_YEAR = 2026;                      // placeholder: the present season
const T_IN = 1.8, CLOSE = 1.45, PRE = 0.12, SLIDE = 1.7, POST = 0.22;
const END = { dark: 1.3, up: 2.2, open: 2.4, hold: 4.61 };
const SCHED = (() => {
  let t = T_IN;
  const s = PRODS.map((p, i) => {
    const o = { i, p, open0: t, open1: t + p.open };
    o.close0 = o.open1 + p.hold; o.close1 = o.close0 + CLOSE;
    o.slide0 = o.close1 + PRE; o.slide1 = o.slide0 + SLIDE;
    o.y0 = p.year; o.y1 = i + 1 < PRODS.length ? PRODS[i + 1].year : FINAL_YEAR;
    t = o.slide1 + POST;
    return o;
  });
  const e = { dark0: t, dark1: t + END.dark };
  e.up1 = e.dark1 + END.up;                   // the ghost light comes up in the dark house
  e.open0 = e.dark1 + 0.6; e.open1 = e.open0 + END.open;
  e.end = e.up1 + END.open * 0.4 + END.hold;
  return { prods: s, end: e, total: e.end };
})();
if (Math.abs(SCHED.total - DUR) > 0.02) console.error('DUR should be ' + SCHED.total.toFixed(2));

/** Openness of the curtain, 0 shut, 1 gathered at the sides. */
function openAt(t) {
  const e = SCHED.end;
  if (t >= e.open0) return smr((t - e.open0) / END.open);
  for (const s of SCHED.prods) {
    if (t < s.open0) return 0;
    if (t < s.open1) return smr((t - s.open0) / s.p.open);
    if (t < s.close0) return 1;
    if (t < s.close1) return 1 - smr((t - s.close0) / CLOSE);
  }
  return 0;
}
/** The year in the cartouche, continuous while it slides. */
function yearAt(t) {
  let y = PRODS[0].year;
  for (const s of SCHED.prods) if (t >= s.slide0) y = lerp(s.y0, s.y1, smr((t - s.slide0) / SLIDE));
  return y;
}
/** Which production's stage stands behind the curtain at t; -1 is the empty stage at the end. */
function stageAt(t) {
  if (t >= SCHED.end.dark1 + 0.1) return -1;
  let k = 0;
  for (const s of SCHED.prods) if (t >= s.close1 + 0.05) k = s.i + 1;
  return Math.min(k, PRODS.length - 1);
}
/** House and footlight levels: the evening's own lighting, with the full blackout at the end. */
function lightsAt(t) {
  const e = SCHED.end;
  const inn = sm((t - 0.2) / (T_IN - 0.2));
  const out = 1 - sm((t - e.dark0) / (END.dark * 0.8));
  const ghost = sm((t - e.dark1) / END.up);
  return { foot: inn * out, ghost };
}

/* The leading edges swing: the hem trails the track as the curtain accelerates, then
   rings down. A damped pendulum driven by the edge's acceleration, integrated once at
   load on a 1/240 s step and interpolated, so every frame stays pure in t.          */
const SWING = (() => {
  const dt = 1 / 240, n = Math.ceil((DUR + 1) / dt), q = new Float32Array(n + 1);
  const w = TAU * 0.7, z = 0.16;
  let x = 0, v = 0;
  const pos = (t) => openAt(t);
  for (let i = 0; i <= n; i++) {
    const t = i * dt, acc = (pos(t + dt) - 2 * pos(t) + pos(t - dt)) / (dt * dt);
    q[i] = x;
    const a = -w * w * x - 2 * z * w * v + acc * 0.6;
    v += a * dt; x += v * dt;
  }
  return q;
})();
function swingAt(t) {
  const f = clamp(t, 0, DUR) * 240, i = Math.floor(f), u = f - i;
  return lerp(SWING[i] || 0, SWING[i + 1] || 0, u);
}

/* ── the frame: house wall, portal, cartouche (PLACEHOLDER portal) ────────────── */

const OP = { x0: 158, x1: 922, y0: 262, y1: 868 };          // the opening
const PT = { x0: 104, x1: 976, y0: 206, y1: 868 };          // the portal's outer edge
const CART = { x: 540, y: 214, rx: 150, ry: 52 };           // cartouche for the year

function houseWall(L) {
  const p = new Path2D(); p.rect(-10, -10, W + 20, W + 20); p.rect(PT.x0, PT.y0, PT.x1 - PT.x0, OP.y1 + 2 - PT.y0);
  put(p, { indigo: 0.93, pink: 0.44 + 0.08 * L.foot, blue: 0.22, yellow: 0.1 }, 'evenodd');
  // pilasters of the side walls, barely there
  for (const x of [34, 1046]) add(rectP(x - 18, 120, x + 18, 900), { indigo: 0.08, pink: 0.06 });
}
function portal(L, open) {
  const lit = 0.08 + 0.6 * L.foot + 0.3 * open;              // footlights and stage spill rake the gilding
  const g = (a) => ({ yellow: 0.5 + 0.28 * a, pink: 0.18 + 0.16 * (1 - a), indigo: 0.1 + 0.7 * (1 - a) });
  // outer moulding, flat with ornament, inner bead: three bands round the opening
  const band = (o, i, cov) => { const p = new Path2D(); p.rect(OP.x0 - o, OP.y0 - o, OP.x1 - OP.x0 + 2 * o, OP.y1 - OP.y0 + o); p.rect(OP.x0 - i, OP.y0 - i, OP.x1 - OP.x0 + 2 * i, OP.y1 - OP.y0 + i + 1); put(p, cov, 'evenodd'); };
  band(54, 44, g(lit * 0.7));
  band(44, 12, g(lit * 0.45));

  const orn = new Path2D(), r = rngFor('portal:orn');
  const ring = (x, y, a) => { orn.moveTo(x + Math.cos(a) * 9, y + Math.sin(a) * 9); orn.ellipse(x, y, 9, 5, a, 0, TAU); };
  for (let x = OP.x0 - 28; x <= OP.x1 + 28; x += 26) ring(x, OP.y0 - 28, 0);
  for (let y = OP.y0 + 4; y <= OP.y1 - 10; y += 26) { ring(OP.x0 - 28, y, Math.PI / 2); ring(OP.x1 + 28, y, Math.PI / 2); }
  add(orn, { indigo: 0.3 + 0.2 * (1 - lit), pink: 0.14 });

}
function cartouche(t, L) {
  const { x, y, rx, ry } = CART;

    const pts = [];
    for (let i = 0; i <= 24; i++) { const a = i / 24 * TAU * 1.1; const rr = 22 * (1 - i / 30); pts.push([x + s * (rx + 18 + rr * Math.cos(a)), y + 6 + rr * Math.sin(a) * 0.8]); }
    return pts;
  };
  for (const s of [-1, 1]) put(nib(scroll(s), (u) => 7 * (1 - u * 0.7), { per: 4 }), { yellow: 0.7, pink: 0.2, indigo: 0.12 });
  const rim = new Path2D(); rim.ellipse(x, y, rx + 12, ry + 10, 0, 0, TAU);
  put(rim, { yellow: 0.72, pink: 0.2, indigo: 0.1 + 0.1 * (1 - L.foot) });
  const field = new Path2D(); field.ellipse(x, y, rx, ry, 0, 0, TAU);
  put(field, { indigo: 0.9, blue: 0.4, pink: 0.3 });

  const yr = yearAt(t), SP = 205, v = (yearAt(t + 1 / 60) - yearAt(t - 1 / 60)) * 30 * SP;
  const m = mask(0);
  m.save(); m.beginPath(); m.ellipse(x, y, rx - 6, ry - 5, 0, 0, TAU); m.clip();

    for (let k = Math.floor(yr) - 2; k <= Math.ceil(yr) + 2; k++) {
      const cx = x + (k - yr) * SP;
      if (Math.abs(cx - x) > rx + 140) continue;
      drawYear(mm, String(k), cx, y, 58);
    }
  });
  m.restore();
  const gl = 0.25 + 0.75 * Math.max(L.foot, L.ghost);
  putM(m, { yellow: 0.9, pink: 0.28, indigo: 0.7 * (1 - gl) });
}

/* Numerals drawn as calligraphic strokes: thick downstrokes, thin joins. Unit cell

const DIG = {

  3: [[[0.08, 0.14], [0.3, 0.02], [0.5, 0.1], [0.52, 0.28], [0.27, 0.46]], [[0.27, 0.46], [0.53, 0.58], [0.56, 0.78], [0.41, 0.96], [0.2, 0.97], [0.05, 0.86]]],

const GLYPH = {};
function glyph(d) {

/* ── the curtain: two halves on a traveller track ──────────────────────────────── */

const CUR = { folds: 10, gather: 104, overlap: 34, hem: OP.y1 - 4, top: OP.y0 - 2 };
const FOLDW = (() => { const r = rngFor('curtain:folds'), a = []; for (let s = 0; s < 2; s++) { const w = []; for (let i = 0; i < CUR.folds; i++) w.push(0.8 + 0.4 * r()); const sum = w.reduce((p, q) => p + q, 0); a.push(w.map(v => v / sum)); } return a; })();
function curtain(t, L) {
  const u = openAt(t), q = swingAt(t), h = CUR.hem - CUR.top;
  const warm = clamp(0.05 + 0.95 * L.foot, 0, 1);
  for (const side of [-1, 1]) {   // right half last: it laps over the left at centre
    const fixed = side < 0 ? OP.x0 : OP.x1;
    const lead = side < 0 ? lerp(W / 2 + CUR.overlap, OP.x0 + CUR.gather, u) : lerp(W / 2 - CUR.overlap, OP.x1 - CUR.gather, u);
    const span = lead - fixed, ws = FOLDW[side < 0 ? 0 : 1];
    const depth = lerp(0.35, 1, u);                              // gathered folds are deeper
    let acc = 0;
    const xs = [fixed];
    for (const w of ws) { acc += w; xs.push(fixed + span * acc); }
    const sway = (k, y) => {                                     // the fabric near the lead swings most
      const v = (y - CUR.top) / h;
      return -side * q * 140 * Math.pow(v, 1.6) * Math.pow(k / CUR.folds, 1.2);
    };
    // clear everything behind the half with one seamless silhouette first: adjacent fold
    // strips each half-clear their shared antialiased edge, which let the stage print
    // through along every fold line
    const sil = [];
    for (let j = 0; j <= 12; j++) { const y = CUR.top + h * j / 12; sil.push([fixed, y]); }
    sil.push([fixed, CUR.hem + 20]);
    for (let k = CUR.folds; k >= 0; k--) sil.push([xs[k] + sway(k, CUR.hem + 12), CUR.hem + 14]);
    for (let j = 12; j >= 0; j--) { const y = CUR.top + h * j / 12; sil.push([xs[CUR.folds] + sway(CUR.folds, y) + side * 1.5, y]); }
    put(poly(sil), { pink: 0.8, yellow: 0.3 * warm, indigo: 0.4 * (1.2 - warm) });
    // folds as strips: trough, lit crest, trough; the hem dips at each crest
    for (let k = 0; k < CUR.folds; k++) {
      const a = xs[k], b = xs[k + 1], pts = [];
      for (let j = 0; j <= 12; j++) { const y = CUR.top + h * j / 12; pts.push([a + sway(k, y), y]); }
      const hemA = CUR.hem + 3, hemM = CUR.hem + 6 + 5 * depth, n2 = 8;
      for (let j = 0; j <= n2; j++) {
        const f = j / n2, x = lerp(a, b, f), y = lerp(hemA, hemM, Math.sin(Math.PI * f));
        pts.push([x + sway(k + f, y), y]);

      const x0 = Math.min(a, b) + sway(k + 0.5, CUR.top + h * 0.7), x1 = Math.max(a, b) + sway(k + 0.5, CUR.top + h * 0.7);
      const L0 = side < 0 ? x0 : x1, L1 = side < 0 ? x1 : x0;      // gradient runs from the fixed side of each fold

      const crest = mixCov({ pink: 0.52, yellow: 0.1, indigo: 0.86, blue: 0.3 }, { pink: 0.64, yellow: 0.52, indigo: 0.05 }, wl);
      const trough = mixCov({ pink: 0.5, yellow: 0.04, indigo: 0.95, blue: 0.42 }, { pink: 0.86, yellow: 0.3, indigo: 0.6 * dk }, wl);
      const mid = mixCov(crest, trough, 0.45);
      const X = [L0, lerp(L0, L1, 0.2), lerp(L0, L1, 0.45), lerp(L0, L1, 0.8), L1];
      const cov = {};
      for (const n of PL) cov[n] = { xs: X, as: [trough[n], mid[n], crest[n], mid[n], trough[n]] };
      put(poly(pts), cov);
    }
    // light falls off upward from the footlights; the top of the curtain sits in the dark
    const whole = poly([[fixed, CUR.top], [lead + sway(CUR.folds, CUR.top), CUR.top], [lead + sway(CUR.folds, CUR.hem), CUR.hem + 12], [fixed, CUR.hem + 12]]);
    add(whole, { indigo: { ys: [CUR.top, CUR.top + h * 0.55, CUR.hem], as: [0.62, 0.18 * (1.3 - warm), 0.02] }, blue: { ys: [CUR.top, CUR.hem], as: [0.3 * (1.2 - warm), 0] } });
    // gold fringe along the hem
    const fr = [];
    for (let k = 0; k <= CUR.folds; k++) { const x = xs[k] + sway(k, CUR.hem); fr.push([x, CUR.hem - 12]); }
    for (let k = CUR.folds; k >= 0; k--) { const x = xs[k] + sway(k, CUR.hem + 12); fr.push([x, CUR.hem + 16]); }
    put(poly(fr), { yellow: 0.62 + 0.25 * warm, pink: 0.2, indigo: 0.22 * (1 - warm) });
    // the leading edge: a dark turned hem where the halves meet
    const le = [];
    for (let j = 0; j <= 12; j++) { const y = CUR.top + h * j / 12; le.push([lead + sway(CUR.folds, y), y]); }
    strokeOn('indigo', poly([...le, ...le.slice().reverse()]), 3, 0.7);
  }
}

/* ── in front: footlights and the front row, the sill ───────────────────────────── */

const ROW = (() => {
  const r = rngFor('frontrow'), a = [];
  const xs = [48, 226, 410, 596, 770, 948, 1090];
  for (const x of xs) a.push({ x: x + (r() - 0.5) * 30, top: 842 + r() * 26, w: 60 + r() * 12, sh: 150 + r() * 30, key: 'head:' + x, hair: r() });
  return a;
})();
function footlights(t, L, open) {

  put(lip, { indigo: 0.82, blue: 0.3, pink: 0.3 });

function frontRow(t, L, rim, present) {

    for (const h of ROW) {
      const p = new Path2D(); p.moveTo(h.x - 88, W + 10); p.lineTo(h.x - 88, 946); p.quadraticCurveTo(h.x - 86, 914, h.x, 912); p.quadraticCurveTo(h.x + 86, 914, h.x + 88, 946); p.lineTo(h.x + 88, W + 10); p.closePath();

      strokeOn('pink', edge, 2.2, 0.35 + 0.4 * rim.a);
    }
    return;
  }
  for (const h of ROW) {
    const wx = wander(h.key + ':x', 0.05, 3)(t) * 4, tilt = wander(h.key + ':t', 0.04, 3)(t) * 0.05;
    const cx = h.x + wx, top = h.top, hw = h.w, pts = [];
    // head and shoulders from behind: skull, a slight neck, shoulders out of frame
    const r = rngFor(h.key);
    const nk = top + hw * 2.05;
    pts.push([cx - h.sh, W + 20], [cx - h.sh * 0.92, nk + 50], [cx - hw * 1.05, nk + 12], [cx - hw * 0.62, nk]);
    for (let i = 0; i <= 16; i++) {
      const a = Math.PI + Math.PI * i / 16, rr = 1 + 0.05 * Math.sin(i * 1.7 + h.hair * 6);
      pts.push([cx + Math.cos(a + tilt) * hw * 0.82 * rr, top + hw * 0.92 + Math.sin(a + tilt) * hw * 0.98 * rr]);
    }
    pts.push([cx + hw * 0.62, nk], [cx + hw * 1.05, nk + 12], [cx + h.sh * 0.92, nk + 50], [cx + h.sh, W + 20]);
    const body = cut(pts, r, { amp: 2.2 });
    put(body, { indigo: 0.96, pink: 0.48, blue: 0.3, yellow: 0.12 });
    // rim of stage light over the crown
    if (rim.a > 0.02) {
      const arc = new Path2D();
      arc.ellipse(cx, top + hw * 0.92, hw * 0.8, hw * 0.96, tilt, Math.PI * 1.18, Math.PI * 1.82);
      const g = rim.cov;
      const rp = new Path2D(); rp.ellipse(cx, top + hw * 0.92, hw * 0.8, hw * 0.96, tilt, Math.PI * 1.15, Math.PI * 1.85);
      for (const n of ['indigo', 'blue']) { const gg = PG[n]; gg.globalCompositeOperation = 'destination-out'; gg.globalAlpha = 0.8 * rim.a; gg.lineWidth = 3.4; gg.stroke(rp); }
      for (const n in g) if (g[n]) strokeOn(n, rp, 3.4, g[n] * rim.a);
    }
  }
}

/* ── stage pictures: PLACEHOLDERS, one per production ───────────────────────────── */

/* Each draws the stage behind the opening. lt: seconds since its curtain began to
   open; up: its lighting cue, 0..1. The shared box: back wall, side masking, floor. */
const VPY = 700;                                         // the stage's eye line: stalls, seated
function stageBox(cov) {
  put(rectP(OP.x0, OP.y0, OP.x1, OP.y1 + 2), cov.back);
  const fl = poly([[OP.x0, OP.y1 + 2], [OP.x1, OP.y1 + 2], [OP.x1 - 150, 770], [OP.x0 + 150, 770]]);
  put(fl, cov.floor);
  for (const s of [-1, 1]) {
    const x = s < 0 ? OP.x0 : OP.x1;
    put(poly([[x, OP.y0], [x + s * -150, OP.y0 + 40], [x + s * -150, 770], [x, OP.y1 + 2]]), cov.side);
  }
  put(rectP(OP.x0, OP.y0, OP.x1, OP.y0 + 60), cov.border);
}
function pool(x, y, rx, ry, a, cov) {
  for (const n in cov) {
    const g = PG[n]; if (!g) continue;
    g.save(); g.translate(x, y); g.scale(1, ry / rx);
    g.globalCompositeOperation = 'destination-out'; g.globalAlpha = 1;
    g.fillStyle = radial(g, 0, 0, rx * 0.2, rx, a * cov[n], 0);
    g.fillRect(-rx, -rx, rx * 2, rx * 2);
    g.restore();
  }
}
function figure(x, yFeet, hgt, lean, cov) {
  const w = hgt * 0.14, r = rngFor('fig:' + Math.round(x) + ':' + Math.round(hgt));
  const p = cut([[x - w * 0.5, yFeet], [x - w * 0.62, yFeet - hgt * 0.45], [x - w * 0.7 + lean * 0.3, yFeet - hgt * 0.78], [x - w * 0.34 + lean, yFeet - hgt * 0.86],
                 [x - w * 0.3 + lean, yFeet - hgt * 0.98], [x + w * 0.3 + lean, yFeet - hgt * 0.98], [x + w * 0.34 + lean, yFeet - hgt * 0.86],
                 [x + w * 0.7 + lean * 0.3, yFeet - hgt * 0.78], [x + w * 0.62, yFeet - hgt * 0.45], [x + w * 0.5, yFeet]], r, { amp: 1.2 });
  put(p, cov);
}
const STAGES = {
  salon(lt, up) {
    stageBox({ back: { yellow: 0.3, pink: 0.24, indigo: 0.12 * (1 - up) }, floor: { pink: 0.5, yellow: 0.3, indigo: 0.3 }, side: { pink: 0.4, yellow: 0.3, indigo: 0.4 }, border: { indigo: 0.6, pink: 0.4 } });
    put(rectP(460, 420, 620, 770), { indigo: 0.7, pink: 0.4 });               // a tall double door
    const gap = 40 * sm((lt - 3) / 1.5);
    put(rectP(540 - gap, 430, 540 + gap, 770), { yellow: 0.5 * up });           // it opens on light
    put(rectP(250, 380, 380, 560), { blue: 0.3, yellow: 0.2 });                 // a window
    figure(700, 800, 250, 6, { indigo: 0.8, pink: 0.5 });
    pool(560, 780, 260, 60, up, { indigo: 0.5, pink: 0.2 });
  },
  chair(lt, up) {
    stageBox({ back: { indigo: 0.9, blue: 0.5 }, floor: { indigo: 0.84, blue: 0.4 }, side: { indigo: 0.92, blue: 0.5 }, border: { indigo: 0.95, blue: 0.5 } });
    pool(540, 800, 180 * (0.6 + 0.4 * up), 46, up, { indigo: 1, blue: 1 });
    const c = [[500, 800], [505, 700], [580, 700], [585, 800], [575, 800], [572, 720], [512, 720], [510, 800]];
    put(poly(c), { indigo: 0.8, pink: 0.4 });
    put(rectP(505, 600, 515, 712), { indigo: 0.8, pink: 0.4 });
    put(rectP(572, 600, 582, 712), { indigo: 0.8, pink: 0.4 });
    put(rectP(505, 600, 582, 612), { indigo: 0.8, pink: 0.4 });
  },
  forest(lt, up) {
    stageBox({ back: { blue: 0.5, indigo: 0.3 }, floor: { blue: 0.4, indigo: 0.5 }, side: { blue: 0.5, indigo: 0.6 }, border: { indigo: 0.7, blue: 0.5 } });
    const r = rngFor('forest');
    for (let i = 0; i < 14; i++) {
      const x = OP.x0 + 40 + r() * (OP.x1 - OP.x0 - 80), w = 10 + r() * 22, d = r();
      put(rectP(x, OP.y0, x + w, 770 + d * 90), { blue: 0.3 + 0.3 * d, indigo: 0.3 + 0.5 * d, yellow: 0.1 * (1 - d) * up });
    }
    glow('yellow', 700, 380, 0, 60, 0.4 * up);
  },
  stairs(lt, up) {
    stageBox({ back: { pink: 0.4, indigo: 0.5 }, floor: { pink: 0.4, indigo: 0.6 }, side: { pink: 0.4, indigo: 0.7 }, border: { indigo: 0.8, pink: 0.4 } });
    for (let i = 0; i < 9; i++) {
      const y = 800 - i * 50, x0 = 240 + i * 55;
      put(rectP(x0, y - 50, 920, y), { pink: 0.3 + 0.05 * i, yellow: 0.2 * up, indigo: 0.4 - 0.03 * i });
      put(rectP(x0, y - 50, 920, y - 44), { yellow: 0.5 * up, pink: 0.3 });
    }
    figure(600 + 60 * sm((lt - 1) / 3), 800 - 5.5 * 50 - 50 * sm((lt - 1) / 3), 200, 4, { indigo: 0.85, pink: 0.5 });
  },
  window(lt, up) {
    stageBox({ back: { indigo: 0.7, blue: 0.4 }, floor: { indigo: 0.7, blue: 0.3 }, side: { indigo: 0.8, blue: 0.4 }, border: { indigo: 0.85, blue: 0.5 } });
    const win = rectP(330, 330, 750, 740);
    put(win, { blue: { ys: [330, 740], as: [0.7, 0.3] }, indigo: { ys: [330, 740], as: [0.4, 0.05] } });
    const moon = new Path2D(); moon.arc(640, 420, 34, 0, TAU);
    knock(moon, { blue: 1, indigo: 1 });
    add(moon, { yellow: 0.14 * up });
    for (const x of [330, 470, 610, 750]) put(rectP(x - 7, 330, x + 7, 740), { indigo: 0.85, pink: 0.4 });
    for (const y of [330, 535, 740]) put(rectP(322, y - 7, 758, y + 7), { indigo: 0.85, pink: 0.4 });
    figure(420, 800, 230, -8, { indigo: 0.85, pink: 0.45 });
  },
  rain(lt, up) {
    stageBox({ back: { blue: 0.55, indigo: 0.5 }, floor: { blue: 0.5, indigo: 0.5 }, side: { blue: 0.6, indigo: 0.6 }, border: { indigo: 0.8, blue: 0.5 } });
    const r = rngFor('rain'), p = new Path2D();
    for (let i = 0; i < 160; i++) {
      const x = OP.x0 + r() * (OP.x1 - OP.x0), sp = 700 + r() * 300, len = 26 + r() * 30;
      const y = OP.y0 + fract(r() + lt * sp / 600) * 600;
      p.moveTo(x, y); p.lineTo(x - 3, y + len);
    }
    for (const n of ['blue', 'indigo']) { const g = PG[n]; g.save(); g.globalCompositeOperation = 'destination-out'; g.globalAlpha = 0.7 * up; g.lineWidth = 2; g.stroke(p); g.restore(); }
    const um = new Path2D(); um.moveTo(470, 610); um.quadraticCurveTo(540, 540, 610, 610); um.closePath();
    put(um, { indigo: 0.85, pink: 0.55 });
    figure(540, 800, 200, 0, { indigo: 0.85, pink: 0.5 });
  },
  table(lt, up) {
    stageBox({ back: { yellow: 0.24, pink: 0.2, indigo: 0.5 * (1 - up) + 0.2 }, floor: { pink: 0.4, indigo: 0.5 }, side: { pink: 0.3, indigo: 0.7 }, border: { indigo: 0.8, pink: 0.4 } });
    glow('indigo', 540, 560, 0, 380, 0.6 * up, 'destination-out');
    glow('yellow', 540, 520, 0, 160, 0.45 * up);
    put(rectP(300, 640, 780, 660), { indigo: 0.8, pink: 0.5 });
    for (const x of [320, 760]) put(rectP(x, 660, x + 12, 790), { indigo: 0.8, pink: 0.5 });
    put(rectP(536, OP.y0, 544, 470), { indigo: 0.8 });
    const shade = poly([[500, 470], [580, 470], [610, 510], [470, 510]]);
    put(shade, { yellow: 0.5, pink: 0.3 });
    for (const x of [380, 470, 610, 700]) figure(x, 700, 110, 0, { indigo: 0.85, pink: 0.45 });
  },
};
/** After the house is empty: the ghost light alone on its stand. */
function ghostStage(t, L) {
  stageBox({ back: { indigo: 0.94, blue: 0.5 }, floor: { indigo: 0.9, blue: 0.4 }, side: { indigo: 0.95, blue: 0.5 }, border: { indigo: 0.96, blue: 0.5 } });
  const g = L.ghost, bx = 540, by = 640;
  pool(bx, 800, 330, 70, g, { indigo: 0.75, blue: 0.9 });
  glow('indigo', bx, by, 0, 260, 0.75 * g, 'destination-out');
  glow('blue', bx, by, 0, 300, 0.85 * g, 'destination-out');
  glow('yellow', bx, by, 0, 150, 0.5 * g);
  for (let i = 0; i < 3; i++) {
    const a = -0.6 + i * 0.6, leg = new Path2D(); leg.moveTo(bx, 740); leg.lineTo(bx + Math.sin(a) * 60, 800 + Math.cos(a) * 4);
    strokeOn('indigo', leg, 3, 0.85);
  }
  strokeOn('indigo', poly([[bx, by + 16], [bx, 740], [bx, by + 16]]), 3.4, 0.85);
  const cage = new Path2D();
  for (let i = -2; i <= 2; i++) { cage.moveTo(bx + i * 6, by - 18); cage.quadraticCurveTo(bx + i * 9, by, bx + i * 6, by + 18); }
  strokeOn('indigo', cage, 1.4, 0.7 * g + 0.2);
  const core = new Path2D(); core.arc(bx, by, 7, 0, TAU);
  knock(core, { indigo: 1, blue: 1, pink: 1, yellow: 1 });
}

/* ── the frame ─────────────────────────────────────────────────────────────── */

function drawArt(t) {
  resetPlates();
  const L = lightsAt(t), u = openAt(t), k = stageAt(t);
  houseWall(L);
  clipAll(OPENING);
  let rim = { a: 0, cov: {} };
  if (k >= 0) {
    const s = SCHED.prods[k], lt = t - s.open0, up = sm((t - s.open0 - s.p.open * 0.35) / 1.4) * (1 - sm((t - s.close0 - 0.2) / 1.0));
    if (QS.get('leak')) put(OPENING, { blue: 1 });        // debug: the stage as pure blue, to catch leaks in the cover
    else STAGES[s.p.look](lt, up);
    rim = { a: Math.max(0.6 * L.foot * (1 - u), 0.9 * u * up), cov: { yellow: 0.6, pink: 0.3 } };
  } else {
    ghostStage(t, L);
    rim = { a: 0.6 * L.ghost, cov: { yellow: 0.5 } };
  }
  curtain(t, L);
  unclipAll();
  portal(L, u);
  cartouche(t, L);
  footlights(t, L, u);
  frontRow(t, L, rim, t < SCHED.end.dark1 + 0.1);   // the house empties under the full blackout
  // full cover at the start and the end: every plate toward the house's own dark
  compose0(t);
}
function coverAt(t) {
  const e = SCHED.end;
  const din = 1 - sm(t / 0.5);
  const dend = t >= e.dark0 ? sm((t - e.dark0 - END.dark * 0.55) / (END.dark * 0.45)) * (1 - sm((t - e.dark1 - 0.2) / 1.6)) : 0;
  return Math.max(din, dend);
}
function compose0(t) {
  const D = coverAt(t);
  if (D > 0.001) blackout(D);
  compose();
}
function blackout(D) {
  for (const n of PL) {
    const g = PG[n], target = { indigo: 0.95, blue: 0.24, pink: 0.46, yellow: 0.1 }[n] || 0;
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'destination-out'; g.globalAlpha = D; g.fillRect(0, 0, W, W);
    if (target) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = D * target; g.fillRect(0, 0, W, W); }
    g.restore();
  }
}
const SHOTS = [
  { id: 'house', start: 0, end: SCHED.prods[0].open0, readAt: T_IN * 0.9, action: 'the footlights come up on the closed curtain; first year in the cartouche', transition: 'from dark' },
  ...SCHED.prods.map(s => ({ id: 'p' + (s.i + 1) + '-' + s.p.look, start: s.open0, end: s.slide1 + POST, readAt: s.open1 + s.p.hold * 0.5, action: 'curtain opens on ' + s.p.look + ' (' + s.p.year + '), closes, the year slides to ' + s.y1, transition: 'curtain' })),
  { id: 'ghost', start: SCHED.end.dark0, end: DUR, readAt: DUR - 1.5, action: 'blackout; the curtain opens on the empty stage and its ghost light; the front row is empty', transition: 'blackout' },
];
// ART END

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=canvas.height=OUT;
paper=bakePaper();
const scrub=document.getElementById('scrub'),clockLabel=document.getElementById('time');
function render(t) {
  t=clamp(t,0,DUR); ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.drawImage(paper,0,0);drawArt(t);scrub.value=t;clockLabel.value=t.toFixed(2);
}
function paintBaked(id) {
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.drawImage(bakeScene(id,OUT),0,0);ctx.restore();
}
/* A frame slower than the frame interval cannot play live (live-plate films take
   100-200 ms): Play then renders every frame once into a WebP cache, shown as
   "Buffering n%", and plays from it at FPS; replays are immediate. Fast films play
   live. seek() and window.__riso stay live and pure; tools never touch the cache. */
const FPS=30,NF=Math.round(DUR*FPS),cache=[],bitmaps=new Map(),playBtn=document.getElementById('play');
let at=0,playing=false,epoch=0,recorder=null,recordURL=null,slow=null,buffering=false,filled=0;
function label(){playBtn.textContent=playing?'Pause':buffering?'Buffering '+Math.round(filled/(NF+1)*100)+'%':'Play';}
function start(){if(at>=DUR)at=0;epoch=performance.now()-at*1000;playing=true;label();}
function pause(){if(playing)at=clamp((performance.now()-epoch)/1000,0,DUR);playing=false;buffering=false;label();if(recorder?.state==='recording')recorder.stop();}
async function buffer(){
  buffering=true;label();const resume=at;
  for(let i=0;i<=NF&&buffering;i++){
    if(cache[i])continue;
    render(i/FPS);canvas.toBlob(b=>{cache[i]=b;filled++;},'image/webp',0.8);   // snapshots now, encodes alongside the next draw
    label();await new Promise(r=>setTimeout(r,0));
  }
  while(buffering&&filled<NF+1)await new Promise(r=>setTimeout(r,50));
  if(buffering){buffering=false;at=resume;start();}
}
function play(){
  if(at>=DUR)at=0;
  if(slow===null){const t0=performance.now();render(at);render(at);slow=(performance.now()-t0)/2>900/FPS;}
  if(!slow||filled>=NF+1)start();else buffer();
}
function seek(t){pause();at=clamp(t,0,DUR);render(at);}
playBtn.onclick=()=>playing||buffering?pause():play();
document.getElementById('replay').onclick=()=>{seek(0);play();};
scrub.oninput=()=>seek(Number(scrub.value));
addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(['Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')playing||buffering?pause():play();if(e.code==='ArrowLeft')seek(at-1/FPS);if(e.code==='ArrowRight')seek(at+1/FPS);});
document.getElementById('record').onclick=()=>{
  if(recorder?.state==='recording'){pause();return;}
  const mime=['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime)throw Error('No supported recording codec; use tools/render.mjs');
  seek(0);const stream=canvas.captureStream(FPS),chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recordURL)URL.revokeObjectURL(recordURL);recordURL=URL.createObjectURL(new Blob(chunks,{type:mime}));const a=document.getElementById('download');a.href=recordURL;a.download='preview.webm';a.style.display='inline';};
  recorder.start();play();
};
function tick(now){
  if(playing){
    at=clamp((now-epoch)/1000,0,DUR);
    if(!slow)render(at);
    else{
      const i=Math.min(NF,Math.floor(at*FPS));
      for(let j=i;j<Math.min(NF+1,i+8);j++)if(cache[j]&&!bitmaps.has(j)){bitmaps.set(j,null);createImageBitmap(cache[j]).then(b=>bitmaps.set(j,b));}
      for(const [j,b] of bitmaps)if(j<i-1){if(b)b.close();bitmaps.delete(j);}
      const b=bitmaps.get(i);
      if(b){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(b,0,0);scrub.value=at;clockLabel.value=at.toFixed(2);}
    }
    if(at>=DUR)pause();
  }
  requestAnimationFrame(tick);
}
window.__riso={duration:DUR,ready:false,seek,shots:SHOTS};
for(const id of Object.keys(SCENES))bakeScene(id,OUT);
seek(Number(new URLSearchParams(location.search).get('t'))||0);
requestAnimationFrame(tick);
window.__riso.ready=true;
</script></html>
